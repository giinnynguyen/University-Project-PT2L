<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Thanh toán</title>
  <link rel="icon" type="image/icon" href="img/icon.png">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/index.css">
  <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/w3data.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="admin/js/data.js"></script>
  <script src="js/javascript.js" type="text/javascript"></script>
  <link rel="stylesheet" href="css/remodal.css">
  <link rel="stylesheet" href="css/remodal-default-theme.css">
  <script src="js/remodal.min.js"></script>
  <style>
    .form {
      overflow: hidden;
    }
  </style>
  <!--     // <script src="https://maps.googleapis.com/maps/api/js?callback=initMap" async defer></script> -->
  <!--  -->
  <script type="text/javascript">
    $(function () {
      $("tbody").html(function () {
        var s = "";
        for (var i = 0; i < loginUser.cart.length; i++) {
          s += " <tr><td>" + loginUser.cart[i].ten_san_pham + "</td><td>" + loginUser.cart[i].count + "</td><td>" + (loginUser.cart[i].count * loginUser.cart[i].price).formatMoney(0, ",", ".") + " đ</td></tr>";
        };
        return s;

      });
    });
  </script>
  <link rel="stylesheet" href="css/checkout.css">
</head>

<body>
  <!-- header -->
  <div w3-include-html="include/header.html"></div>
  <!-- header end -->
  <!-- navigation menu -->
  <!-- nav -->
  <div w3-include-html="include/nav.html"></div>
  <!-- nav end -->
  <div class="body-page" id="body">
    <div class="container" style="min-height: 500px">
      <ul class="one-step-checkout clearfix">
        <h1 class="checkout_header">Thanh toán</h1>
        <!-- <p class="subtitle">
              THANH TOÁN
            Điền vào các mục dưới đây để hoàn thành mua hàng của bạn !</p> -->
        <form action="" class="form">
          <div id="onestepcheckout-shipping-payment-review">
            <div class="order-review-section">
              <h3>Phương thức thanh toán</h3>
              <div class="clear"></div>
              <div class="onestepcheckout-payment-methods">
                <dl class="sp-methods">
                  <dt>
                    <input type="radio" id="payment" name="payment" checked
                      value="Thanh toán bằng thẻ quốc tế Visa/Master">
                    <label for="">Thanh toán bằng thẻ quốc tế Visa/Master</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Thanh toán bằng thẻ ATM nội địa">
                    <label for="">Thanh toán bằng thẻ ATM nội địa</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Chuyển khoản ngân hàng">
                    <label for="">Chuyển khoản ngân hàng</label>
                  </dt>
                  <dt>
                    <input type="radio" id="payment" name="payment" value="Thanh toán tiền mặt khi nhận hàng">
                    <label for="">Thanh toán tiền mặt khi nhận hàng</label>
                  </dt>
                </dl>
              </div>
            </div>
            <div class="onestepcheckout-review-info">
              <div class="order-review-info">
                <h3>Kiểm tra lại đơn hàng</h3>
                <div class="clear"></div>
                <table class="data-table">
                  <thead>
                    <tr class="first">
                      <th>Tên sản phẩm</th>
                      <th>Số lượng</th>
                      <th>Thành tiền</th>
                    </tr>
                  </thead>
                  <tbody>
                  </tbody>
                </table>
                <div class="clear"></div>
                <div style="text-align: center; margin-bottom: 10px"><a href="javascript:void(0)" class="submit"
                    onclick="dat_hang();">Xác nhận đơn hàng</a></div>
              </div>
            </div>

          </div>
        </form>
      </ul>


    </div><!--the-end-contaner-->
  </div><!--the-end-body-page-->
  <div w3-include-html="include/footer.html"></div>
</body>

</html>
<script type="text/javascript">w3IncludeHTML();</script>
