  <link rel="stylesheet" href="css/remodal.css">

  <script src="js/remodal.min.js"></script>
  <script type="text/javascript">
    function xoa_gio_hang(ma_san_pham) {
      for (var i = 0; i < loginUser.cart.length; i++) {
        if (loginUser.cart[i].ma_san_pham == ma_san_pham) {
          loginUser.cart.splice(i, 1);
          break;
        }

      }

      console.log(loginUser.cart);
      gio_hang();

    }

    function gio_hang() {
      countCart();
      var string = "";
      var sum = 0;
      for (var i = 0; i < loginUser.cart.length; i++) {
        sum += (loginUser.cart[i].price * loginUser.cart[i].count);
        string += "<tr><td><img  style='width: 46%;height:initial;' src=" + baseUrl + "/imageProduct/" + loginUser.cart[i].image + " /></td><td>" + loginUser.cart[i].ten_san_pham + "</td><td>" + (parseInt(loginUser.cart[i].price)).formatMoney(0, ",", ".") + "</td><td>" + loginUser.cart[i].count + "</td><td>" + (loginUser.cart[i].price * loginUser.cart[i].count).formatMoney(0, ",", ".") + "</td><td><button onclick=\"xoa_gio_hang(" + loginUser.cart[i].ma_san_pham + ")\"><span class=\"fa fa-trash\"></span></button></td></tr>"
      };
      $("tbody").html(string);
      $("b.sum").html(sum.formatMoney(0, ",", "."));

    }
    $(function () {







      gio_hang();
    });



  </script>


  <style type="text/css">
    .fa-trash {
      font-size: 20px;
      padding: 6px;
    }

    .datagrid table tbody tr td:first-child {
      width: 200px;
    }

    .datagrid table tbody tr td:first-child img {
      width: 90%;
      height: 100%;
    }

    .datagrid table tbody tr {
      height: 150px;
    }

    .datagrid table td {
      padding: 0;
      text-align: center;
    }

    .datagrid table tfoot tr {
      border-top: 1px solid #7BEBD8;
      background-color: #E1EEF4;
    }
  </style>

  <div w3-include-html="include/header.html"></div>

  <div class="body-page" id="body" style="margin-bottom: 50px">

      <hr>
      <h3>Giỏ hàng của tôi</h3>
      <div class="datagrid">
        <table>
          <thead>
            <tr>
              <th>Hình ảnh</th>
              <th>Tên sản phẩm</th>
              <th>Giá (VNĐ)</th>
              <th>Số lượng</th>
              <th>Thành tiền (VNĐ)</th>
              <th>Xóa</th>
            </tr>
          </thead>
          <tbody>

            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">
                <span>Tổng tiền: <b class="sum"></b> <b>VND</b></span>
              </td>
              <td colspan="4">
                <ul>
                  <li><a href="."><span>Chọn thêm</span></a></li>
                  <li><a href="javascript:void(0)"
                      onclick="loginUser.cart=[];localStorage.loginUser = encodeURIComponent(JSON.stringify(loginUser));window.location.reload();"><span>Xóa
                        hết giỏ hàng</span></a></li>
                  <li><a href="thanhtoan.html"><span>Thanh toán</span></a></li>
                </ul>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
