		<script>
		$(function(){
				$(".form").submit(function(e){
				if(checkEmail == true && checkPass == true && checkUser == true && checkPhone == true && checkDate == true && checkAddress == true){
					console.log("submit");
					var x = $(this).serializeArray();
				var id=0;
				
				for (i=0;i< khach_hang.length;i++){
					if(khach_hang[i].email == x[0].value){
						$('.email-exist').css("display","inline-block");
						e.preventDefault();
						return false;
					}else{
						$('.email-exist').css("display","none");
					}
					if(id < parseInt(khach_hang[i].ma_khach_hang)){
					id =  parseInt(khach_hang[i].ma_khach_hang);
					}
				}
				khach_hang.push({
					"ma_khach_hang":(id+1),
		"ten_khach_hang": x[4].value,
		"phai": x[2].value,
		"ngay_sinh": x[5].value,
		"dia_chi":  x[6].value,
		"dien_thoai":  x[3].value,
		"email":  x[0].value,
		"pass":  x[1].value
					});
					window.localStorage.khach_hang  = encodeURIComponent(JSON.stringify(khach_hang));
					alert("Đăng ký thành công !");
					window.location ="login-user.html";
					e.preventDefault();
				
				
			}else{
				//email
				if(checkEmail==false){
					var email = $("#email").val();
				var re = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
				if(email == ""){
					$('.email-invalid').css("display","none");
			$('.email-empty').css("display","inline-block");
			checkEmail = false;
			}else if(!email.match(re)){
			$('.email-empty').css("display","none");
			$('.email-invalid').css("display","inline-block");
			checkEmail = false;
			}
				else{
			$('.email-empty').css("display","none");
			$('.email-invalid').css("display","none");
			checkEmail =  true;
			}
				}
				//email end
				//pass
				if(checkPass == false){
					var pass = $("#pass").val();
				if(pass == "" ||pass.length < 6 ){
			$('.pass-invalid').css("display","inline-block");
			checkPass = false;
			}
				else{
			$('.pass-invalid').css("display","none");
			checkPass = true;
			}
				}
				//pass end
				//user 
				if(checkUser == false){
				var username = $("#username").val();
				if(username == ""){
			$('.user-empty').css("display","inline-block");
				checkUser = false;
			}else{
			$('.user-empty').css("display","none");
			checkUser = true;
			}
			}
				//user end
				//phone
				if(checkPhone == false){
					var phone = $("#phone").val();
				if(phone == ""){
			$('.phone-empty').css("display","inline-block");
			checkPhone = false;
			}
				else{
			$('.phone-empty').css("display","none");
			checkPhone = true;
			}
				}
				//end phone

				//date
				if(checkDate == false){
					var date = $("#date").val();
				if(phone == ""){
			$('.date-empty').css("display","inline-block");
			checkDate = false;
			}
				else{
			$('.date-empty').css("display","none");
			checkDate = true;
			}
				}
				//end date

				//address
				if(checkAddress == false){
					var address = $("#address").val();
				if(address == ""){
			$('.address-empty').css("display","inline-block");
			checkAddress = false;
			}
				else{
			$('.address-empty').css("display","none");
			checkAddress = true;
			}
				}
				//end address

				return false;
			}
			});
		});
		
		</script>

		/*validate form start*/
		.input-holder {
		position: relative;
		}
		form #form-validate input, form #form-validate input textarea {

		padding: 10px;
		width: 100%;
		resize: none;

		}

		}
		textarea {
		min-height: 100px;
		}
		.error {
		position: absolute;
		z-index: 9;
		display: none;
		padding: 6px;
		color: red;
		text-align: center;
		font-size: 25px;
		top : 0;
		right: 0;
		}
		.is-valid {
		border-color: #AAD661 !important;
		}
		.not-valid {
		border-color: #D7595F;
		transition: 0;
		
		}
		input.validate.not-valid{
		border: 1px solid red;
		}
		.not-valid+.error {
		display: block !important;
		}
		.submit {
		border: 2px solid #ccc;
		border-radius: 4px;
		}
		.submit:hover {
		color: #AAD661;
		border-color: #AAD661;
		}
		.email-exist,.phone-empty,.date-empty,.address-empty{
			color: red;

		</style>

				if(email == ""){

			checkEmail = false;
			}else if(!email.match(re)){
